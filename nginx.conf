# 青云旅游 B2C 平台 - Nginx 生产环境配置
# 运行说明: nginx -c d:/code/jvProject/QyWeb/Web/nginx.conf

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 开启 Gzip 压缩，优化 B2C 首屏加载性能 (LCP < 1.5s)
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json;
    gzip_vary on;

    upstream qy_backend {
        server 127.0.0.1:8080;
    }

    server {
        listen       8181;
        server_name  localhost;

        # 前端静态资源部署目录 (npm run build 产物)
        root   d:/code/jvProject/QyWeb/Web/frontend/dist;

        # 解决 Vue Router History 模式 404 问题
        location / {
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 静态资源强缓存 (Hash 命名的文件)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API 请求反向代理
        location /api/ {
            # 转发到后端 Spring Boot 服务
            proxy_pass http://qy_backend/; 
            
            # 传递真实客户端信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 生产环境安全响应头
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            
            # 支持跨域 (CORS) - 虽同域部署非必须，但为 CDN 扩展预留
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            # 超时控制
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 错误页重定向
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
